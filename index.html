<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Узнай свой айпи</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        h1 {
            color: #f0f9ff;
            font-weight: 500;
            font-size: 1.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subhead {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2.2rem;
            border-left: 3px solid #38bdf8;
            padding-left: 14px;
        }

        .ip-block {
            background: #0b1622;
            border-radius: 28px;
            padding: 1.5rem 1.8rem;
            margin-bottom: 1.2rem;
            border: 1px solid #2d3b4f;
            transition: border-color 0.2s;
        }

        .ip-block:hover { border-color: #38bdf8; }

        .label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
            color: #7e8ea8;
            margin-bottom: 8px;
        }

        .value {
            font-size: 2.2rem;
            font-weight: 600;
            color: #e2e8f0;
            word-break: break-word;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        .provider-value {
            font-size: 1.5rem;
            font-weight: 500;
            color: #bae6fd;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 0.95rem;
            flex-wrap: wrap;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 10px;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .error-message {
            background: #7f1d1d40;
            border-left: 4px solid #ef4444;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            color: #fecaca;
            font-size: 0.9rem;
            margin-top: 1rem;
            line-height: 1.5;
        }

        .refresh-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            background: #2d3b4f;
            color: #f1f5f9;
            border-color: #38bdf8;
        }

        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .flag { font-size: 1.3rem; }

        .source-badge {
            display: inline-block;
            font-size: 0.7rem;
            color: #64748b;
            background: #0b1622;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
            border: 1px solid #1e293b;
        }

        .attempts-log {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            font-family: monospace;
            line-height: 1.5;
        }

        .attempts-log .ok { color: #4ade80; }
        .attempts-log .fail { color: #f87171; }
    </style>
</head>
<body>
    <div class="card">
        <h1><span>🌐</span> Мой IP</h1>
        <div class="subhead">IP-адрес, провайдер и геолокация</div>

        <div class="ip-block">
            <span class="label">IP-адрес</span>
            <div class="value" id="ipValue">загрузка…</div>
        </div>

        <div class="ip-block">
            <span class="label">Провайдер</span>
            <div class="value provider-value" id="providerValue">определяется…</div>
        </div>

        <div class="ip-block" style="padding: 1rem 1.8rem;">
            <div class="flex-row">
                <span class="label" style="margin-bottom: 0;">🌍 Геолокация</span>
                <span class="flag" id="countryFlag"></span>
            </div>
            <div id="locationValue" style="font-size: 1.2rem; font-weight: 500; color: #cbd5e1; margin-top: 6px;">—</div>
        </div>

        <div class="flex-row" style="margin-top: 0.5rem;">
            <div class="status">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Ожидание…</span>
            </div>
            <button class="refresh-btn" id="refreshBtn">
                <span>⟳</span> Обновить
            </button>
        </div>

        <div id="attemptsLog" class="attempts-log" style="display: none;"></div>

        <div id="errorContainer" style="display: none;" class="error-message"></div>
    </div>

    <script>
        const ipEl = document.getElementById('ipValue');
        const providerEl = document.getElementById('providerValue');
        const locationEl = document.getElementById('locationValue');
        const countryFlagEl = document.getElementById('countryFlag');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const refreshBtn = document.getElementById('refreshBtn');
        const errorContainer = document.getElementById('errorContainer');
        const attemptsLog = document.getElementById('attemptsLog');

        const log = [];

        function addLog(name, ok, msg) {
            const icon = ok ? '✓' : '✗';
            const cls = ok ? 'ok' : 'fail';
            log.push(`<span class="${cls}">${icon} ${name}</span> — ${msg}`);
            attemptsLog.innerHTML = log.join('<br>');
            attemptsLog.style.display = 'block';
        }

        function setLoading() {
            ipEl.textContent = 'загрузка…';
            providerEl.textContent = 'определяется…';
            locationEl.textContent = '—';
            countryFlagEl.textContent = '';
            errorContainer.style.display = 'none';
            attemptsLog.innerHTML = '';
            log.length = 0;
            attemptsLog.style.display = 'none';
            statusDot.style.background = '#facc15';
            statusDot.style.boxShadow = '0 0 10px #facc15';
            statusText.textContent = 'Запрос данных…';
            refreshBtn.disabled = true;
        }

        function setSuccess(source) {
            statusDot.style.background = '#4ade80';
            statusDot.style.boxShadow = '0 0 10px #4ade80';
            statusText.innerHTML = 'Данные актуальны <span class="source-badge">' + source + '</span>';
            errorContainer.style.display = 'none';
            refreshBtn.disabled = false;
        }

        function setError(msg) {
            errorContainer.textContent = '❌ ' + msg;
            errorContainer.style.display = 'block';
            statusDot.style.background = '#ef4444';
            statusDot.style.boxShadow = '0 0 10px #ef4444';
            statusText.textContent = 'Ошибка';
            ipEl.textContent = '—';
            providerEl.textContent = '—';
            locationEl.textContent = '—';
            countryFlagEl.textContent = '';
            refreshBtn.disabled = false;
        }

        function getFlagEmoji(countryCode) {
            if (!countryCode || countryCode.length !== 2) return '';
            const code = countryCode.toUpperCase();
            return String.fromCodePoint(
                0x1F1E6 + code.charCodeAt(0) - 65,
                0x1F1E6 + code.charCodeAt(1) - 65
            );
        }

        function fetchWithTimeout(url, timeout = 8000) {
            return Promise.race([
                fetch(url),
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('таймаут 8 сек')), timeout)
                )
            ]);
        }

        // ==== ИСТОЧНИКИ ====

        // 1. ip-api.com — работает в РФ, отдаёт ISP и org. Ограничение: только HTTP (не HTTPS).
        async function tryIpApiCom() {
            const res = await fetchWithTimeout('http://ip-api.com/json/?fields=status,message,country,countryCode,regionName,city,isp,org,as,query&lang=ru');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (data.status !== 'success') throw new Error(data.message || 'ip-api.com ошибка');

            // Провайдер: ISP, если пусто — org
            const provider = data.isp || data.org || (data.as ? data.as : 'Неизвестный провайдер');

            return {
                ip: data.query,
                provider: provider,
                country: data.country || '',
                countryCode: data.countryCode || '',
                city: data.city || '',
                region: data.regionName || '',
                source: 'ip-api.com'
            };
        }

        // 2. ipwho.is — работает в РФ, HTTPS, без ключа
        async function tryIpWhoIs() {
            const res = await fetchWithTimeout('https://ipwho.is/');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (!data.success) throw new Error(data.message || 'ipwho.is ошибка');

            return {
                ip: data.ip,
                provider: data.connection?.isp || data.connection?.org || 'Неизвестный провайдер',
                country: data.country || '',
                countryCode: data.country_code || '',
                city: data.city || '',
                region: data.region || '',
                source: 'ipwho.is'
            };
        }

        // 3. api.ip.sb — работает в РФ, HTTPS
        async function tryIpSb() {
            const res = await fetchWithTimeout('https://api.ip.sb/geoip');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            return {
                ip: data.ip,
                provider: data.isp || data.organization || 'Неизвестный провайдер',
                country: data.country || '',
                countryCode: data.country_code || '',
                city: data.city || '',
                region: data.region || '',
                source: 'api.ip.sb'
            };
        }

        // 4. ipapi.co — резервный
        async function tryIpApiCo() {
            const res = await fetchWithTimeout('https://ipapi.co/json/');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (data.error) throw new Error(data.reason || 'ipapi.co ошибка');

            return {
                ip: data.ip,
                provider: data.org || (data.asn ? 'AS' + data.asn : 'Неизвестный провайдер'),
                country: data.country_name || '',
                countryCode: data.country_code || '',
                city: data.city || '',
                region: data.region || '',
                source: 'ipapi.co'
            };
        }

        // 5. ipinfo.io — последний резервный
        async function tryIpInfo() {
            const res = await fetchWithTimeout('https://ipinfo.io/json');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            return {
                ip: data.ip,
                provider: data.org || 'Неизвестный провайдер',
                country: data.country || '',
                countryCode: data.country || '',
                city: data.city || '',
                region: data.region || '',
                source: 'ipinfo.io'
            };
        }

        async function fetchIpInfo() {
            setLoading();

            // Порядок: сначала те, что лучше всего работают в РФ
            const sources = [
                { fn: tryIpApiCom, name: 'ip-api.com' },
                { fn: tryIpWhoIs,  name: 'ipwho.is' },
                { fn: tryIpSb,     name: 'api.ip.sb' },
                { fn: tryIpApiCo,  name: 'ipapi.co' },
                { fn: tryIpInfo,   name: 'ipinfo.io' },
            ];

            let lastError = null;

            for (const { fn, name } of sources) {
                try {
                    const info = await fn();

                    ipEl.textContent = info.ip || '—';
                    providerEl.textContent = info.provider || '—';

                    const parts = [info.city, info.region, info.country].filter(Boolean);
                    const uniqueParts = [...new Set(parts)];
                    locationEl.textContent = uniqueParts.length ? uniqueParts.join(', ') : '—';
                    countryFlagEl.textContent = getFlagEmoji(info.countryCode);

                    addLog(name, true, 'успех');
                    setSuccess(info.source);
                    return;
                } catch (err) {
                    console.warn('Источник не сработал:', name, err.message);
                    addLog(name, false, err.message);
                    lastError = err;
                }
            }

            let msg = 'Не удалось получить данные ни от одного сервиса. ';
            if (lastError) msg += 'Последняя ошибка: ' + lastError.message + '. ';
            msg += 'Проверьте интернет и отключите блокировщики рекламы (uBlock, AdGuard) для этой страницы.';
            setError(msg);
        }

        fetchIpInfo();
        refreshBtn.addEventListener('click', fetchIpInfo);
    </script>
</body>
</html>
